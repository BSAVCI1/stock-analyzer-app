services:
  app:
    build:
      context: .
    image: stock-analyzer:paper-local
    environment:
      BSAVCI_REQUIRE_SECRET_FILES: "false"
      BSAVCI_PAPER_CYCLE_ENABLED: "true"
      BSAVCI_WORKER_CYCLE: src.deployment.paper_cycle:paper_cycle
      BSAVCI_WORKER_INTERVAL_SECONDS: "300"
      BSAVCI_WORKER_RUN_IMMEDIATELY: "true"
      BSAVCI_RUN_KEY_PREFIX: local-paper
      BSAVCI_LOCAL_PAPER_BOOTSTRAP: "true"
      PAPER_DATABASE_PATH: /app/data/paper_trading.db
      PAPER_ACCOUNT_ID: ${PAPER_ACCOUNT_ID:-ACC-LOCAL-DEVICE}
      PAPER_RELEASE_ELIGIBLE_STRATEGIES: ${PAPER_RELEASE_ELIGIBLE_STRATEGIES:-trend_pullback}
      PAPER_BROKER_ENABLED: "false"
      PAPER_BROKER_LIVE_TRADING: "false"
