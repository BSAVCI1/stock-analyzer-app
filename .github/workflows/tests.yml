name: Automated tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Build deployment image
        run: docker build --tag stock-analyzer:test .

      - name: Smoke-test deployment health
        run: |
          docker run --detach \
            --name stock-analyzer-test \
            --publish 8080:8080 \
            stock-analyzer:test
          trap 'docker rm --force stock-analyzer-test' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.request

          for attempt in range(30):
              try:
                  with urllib.request.urlopen(
                      "http://127.0.0.1:8080/health/live",
                      timeout=2,
                  ) as response:
                      payload = json.load(response)

                  if (
                      response.status == 200
                      and payload["status"] == "ok"
                  ):
                      break
              except Exception:
                  if attempt == 29:
                      raise

                  time.sleep(1)
          else:
              raise RuntimeError(
                  "Container health endpoint did not start."
              )

          with urllib.request.urlopen(
              "http://127.0.0.1:8080/health/ready",
              timeout=2,
          ) as response:
              payload = json.load(response)

          assert response.status == 200
          assert payload == {
              "checks": {
                  "database": "available",
              },
              "status": "ok",
          }
          PY

      - name: Validate deployment composition
        env:
          BSAVCI_IMAGE: stock-analyzer:test
          BSAVCI_WORKER_CYCLE: approved.module:paper_cycle
        run: docker compose config --quiet

      - name: Verify restart persistence
        run: |
          docker volume create stock-analyzer-persistence
          cleanup() {
            docker rm --force stock-analyzer-first \
              stock-analyzer-second 2>/dev/null || true
            docker volume rm stock-analyzer-persistence \
              2>/dev/null || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name stock-analyzer-first \
            --volume stock-analyzer-persistence:/app/data \
            stock-analyzer:test

          python - <<'PY'
          import time
          import subprocess

          for attempt in range(30):
              result = subprocess.run(
                  [
                      "docker",
                      "exec",
                      "stock-analyzer-first",
                      "python",
                      "-c",
                      (
                          "import urllib.request; "
                          "urllib.request.urlopen("
                          "'http://127.0.0.1:8080/health/ready', "
                          "timeout=2)"
                      ),
                  ],
                  check=False,
              )

              if result.returncode == 0:
                  break

              if attempt == 29:
                  raise RuntimeError(
                      "First container did not become ready."
                  )

              time.sleep(1)
          PY

          docker exec stock-analyzer-first python -c \
            "import os, sqlite3; connection = sqlite3.connect(os.environ['BSAVCI_DATABASE_PATH']); connection.execute('CREATE TABLE deployment_probe(value TEXT NOT NULL)'); connection.execute('INSERT INTO deployment_probe VALUES (?)', ('survived-restart',)); connection.commit(); connection.close()"

          docker rm --force stock-analyzer-first

          docker run --detach \
            --name stock-analyzer-second \
            --volume stock-analyzer-persistence:/app/data \
            stock-analyzer:test

          docker exec stock-analyzer-second python -c \
            "import os, sqlite3; connection = sqlite3.connect(os.environ['BSAVCI_DATABASE_PATH']); value = connection.execute('SELECT value FROM deployment_probe').fetchone()[0]; connection.close(); assert value == 'survived-restart'"

      - name: Verify portable local profile
        run: |
          files="-f compose.yaml -f compose.local.yaml"
          cleanup() {
            docker compose $files down 2>/dev/null || true
          }
          trap cleanup EXIT

          docker compose $files up --detach --build

          python - <<'PY'
          import json
          import time
          import urllib.request

          for attempt in range(30):
              try:
                  with urllib.request.urlopen(
                      "http://127.0.0.1:8080/health/worker",
                      timeout=2,
                  ) as response:
                      payload = json.load(response)

                  if (
                      response.status == 200
                      and payload["status"] == "ok"
                  ):
                      break
              except Exception:
                  if attempt == 29:
                      raise

                  time.sleep(1)
          PY

          docker compose $files restart app

          python - <<'PY'
          import json
          import time
          import urllib.request

          for attempt in range(30):
              try:
                  with urllib.request.urlopen(
                      "http://127.0.0.1:8080/health/worker",
                      timeout=2,
                  ) as response:
                      payload = json.load(response)

                  if (
                      response.status == 200
                      and payload["status"] == "ok"
                  ):
                      break
              except Exception:
                  if attempt == 29:
                      raise

                  time.sleep(1)
          PY

          docker compose $files exec --no-TTY app \
            python -c "import os, sqlite3; path = os.environ['BSAVCI_VALIDATION_DATABASE_PATH']; connection = sqlite3.connect(path); count = connection.execute('SELECT COUNT(*) FROM deployment_validation_cycles').fetchone()[0]; connection.close(); assert count >= 1"

      - name: Verify managed internal-paper adapter
        run: |
          files="-f compose.yaml -f compose.paper-local.yaml"
          cleanup() {
            docker compose $files down --volumes \
              2>/dev/null || true
          }
          trap cleanup EXIT

          docker compose $files build
          docker compose $files run --rm --no-deps app \
            python -m src.deployment.bootstrap

          docker compose $files run --rm --no-deps app \
            python -c "from datetime import datetime, timezone; from src.deployment.paper_cycle import paper_cycle; report = paper_cycle(run_at=datetime(2026, 8, 16, 12, 0, tzinfo=timezone.utc), run_key='ci:paper-cycle'); assert report.cycle.failed_count == 0"

