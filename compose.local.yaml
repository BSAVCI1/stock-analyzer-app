services:
  app:
    build:
      context: .
    image: stock-analyzer:local
    environment:
      BSAVCI_REQUIRE_SECRET_FILES: "false"
      BSAVCI_WORKER_CYCLE: src.deployment.validation:validation_cycle
      BSAVCI_WORKER_INTERVAL_SECONDS: "5"
      BSAVCI_WORKER_RUN_IMMEDIATELY: "true"
      BSAVCI_RUN_KEY_PREFIX: local-validation
      BSAVCI_VALIDATION_DATABASE_PATH: /app/data/deployment_validation.db
